<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Reading and the Laurel</title>
<meta name="description" content="Chapters Two and Three of an interactive exhibition: you read a short film and write its review; then fifty years of honours pile up on it, each citing the one beneath, down to the words you wrote.">
<meta name="theme-color" content="#05070a">
<style>
/* layout: one 4:3 film frame held in the dark of the Chapter One cinema, the front row below it.
   Chapter Two: gold is handwriting, the viewer's reading drawn over the film; it fades by itself.
   Chapter Three: gold is weight, honours stacked on the screen; the viewer lifts them off one by one, down to that same reading. */
:root{color-scheme:dark;
  --ink:#05070a; --ivory:#f1e8d3; --gold:#cdbb8e; --gold-hi:#ebd6a0; --dim:rgba(241,232,211,.62);
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --fw:640px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--ivory);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans)}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;pointer-events:auto}
button:focus-visible{outline:1px solid var(--gold);outline-offset:5px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* chrome (shared with the other chapters) */
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(18px,env(safe-area-inset-top)) clamp(16px,3vw,36px) 0;font-size:.74rem;letter-spacing:.34em;text-transform:uppercase;color:var(--dim)}
.top .left{line-height:1.9}
.top .left b{font-weight:400;color:var(--ivory)}
.top .right{display:flex;gap:6px}
.top button{padding:10px 10px;letter-spacing:.34em;text-transform:uppercase;font-size:.74rem;color:var(--dim);transition:color .6s}
.top button:hover{color:var(--ivory)}
#restartTop{opacity:0;visibility:hidden;transition:opacity 1.6s var(--ease)}
#restartTop.on{opacity:1;visibility:visible}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 clamp(16px,3vw,36px) max(16px,env(safe-area-inset-bottom));display:flex;justify-content:center;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);transition:opacity 2s var(--ease)}
#prog{flex:1;max-width:420px}
#prog .bar{position:relative;height:1px;background:rgba(241,232,211,.16);margin-bottom:10px}
#prog .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);opacity:.8;transition:width 2.4s var(--ease)}
#prog .tick{position:absolute;top:-2px;width:1px;height:5px;background:rgba(241,232,211,.28)}
#prog .lbl{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 10px #000}
body.intro .bottom,body.intro3 .bottom,body.final .bottom{opacity:0}

/* the frame: everything written sits inside the film's 4:3 gate */
#card{position:absolute;left:0;top:0;width:100px;height:75px}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 clamp(10px,4%,44px)}

/* the two openings */
.opening{gap:clamp(8px,calc(var(--fw)*.018),18px);opacity:0;visibility:hidden;transition:opacity 1.6s var(--ease),visibility 0s 1.6s}
body.intro #intro,body.intro3 #intro3{opacity:1;visibility:visible;transition:opacity 2.4s var(--ease),visibility 0s}
.opening h1{font-family:var(--serif);font-weight:300;font-size:clamp(1.8rem,calc(var(--fw)*.07),4.4rem);line-height:1.05;letter-spacing:.005em;text-shadow:0 2px 40px #000;text-wrap:balance}
.opening p{font-family:var(--serif);font-style:italic;font-size:clamp(1rem,calc(var(--fw)*.027),1.45rem);color:var(--dim)}
.cta{margin-top:clamp(10px,calc(var(--fw)*.04),40px);display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px}
.cta .ring{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid rgba(235,214,160,.75);box-shadow:0 0 22px 2px rgba(235,205,140,.35),inset 0 0 14px rgba(235,205,140,.3);animation:breathe 4.4s ease-in-out infinite}
.cta .ring::after{content:"";position:absolute;inset:17px;border-radius:50%;background:#f3e3b4;box-shadow:0 0 14px 3px rgba(243,227,180,.7)}
.cta .t1{font-size:.78rem;letter-spacing:.42em;text-transform:uppercase;color:var(--ivory);padding-left:.42em;text-shadow:0 0 12px #000}
.cta .t2{font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-top:-4px;padding-left:.3em}
.cta:focus-visible{outline:none}
.cta:hover .ring,.cta:focus-visible .ring{box-shadow:0 0 34px 5px rgba(235,205,140,.5),inset 0 0 16px rgba(235,205,140,.4)}
@keyframes breathe{0%,100%{opacity:.78;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}

/* questions */
#ask{gap:clamp(14px,calc(var(--fw)*.042),40px);opacity:0;visibility:hidden;transition:opacity 1.2s var(--ease),visibility 0s 1.2s}
#ask.on{opacity:1;visibility:visible;transition:opacity 1.8s var(--ease),visibility 0s}
.q,.s{font-family:var(--serif);font-weight:400;font-size:clamp(.92rem,calc(var(--fw)*.023),1.36rem);letter-spacing:.26em;text-transform:uppercase;padding-left:.26em;line-height:1.7;text-wrap:balance;max-width:34em;text-shadow:0 1px 18px #000,0 0 3px rgba(0,0,0,.6)}
.opts{display:grid;grid-template-columns:auto;justify-items:center}
.opts.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{position:relative;min-height:44px;padding:9px 18px;font-family:var(--serif);font-style:italic;font-size:clamp(1.02rem,calc(var(--fw)*.0245),1.36rem);line-height:1.25;color:var(--dim);opacity:0;transition:opacity 1.4s var(--ease) var(--d,0s),color .6s}
#ask.on .opt{opacity:1}
#ask:not(.ready) .opt{pointer-events:none}
.opts.caps .opt{font-style:normal;text-transform:uppercase;letter-spacing:.3em;padding:9px 12px 9px calc(12px + .3em);font-size:clamp(.8rem,calc(var(--fw)*.018),1.02rem)}
.opt::after{content:"";position:absolute;left:50%;right:50%;bottom:7px;height:1px;background:var(--gold);opacity:.75;transition:left .7s var(--ease),right .7s var(--ease)}
.opt:hover,.opt:focus-visible,.opt.chosen{color:var(--ivory)}
.opt:hover::after,.opt:focus-visible::after,.opt.chosen::after{left:14px;right:14px}
.opt:focus-visible{outline:none}
#ask.picked .opt{pointer-events:none}
#ask.picked .opt:not(.chosen){opacity:0;transition:opacity 1s var(--ease)}

/* the review the viewer writes without meaning to */
#rev{gap:clamp(8px,calc(var(--fw)*.022),20px);opacity:0;visibility:hidden;transition:opacity 1.4s var(--ease),visibility 0s 1.4s}
#rev.on{opacity:1;visibility:visible;transition:opacity 1.8s var(--ease),visibility 0s}
#rev .stars{font-family:var(--serif);color:var(--gold-hi);letter-spacing:.32em;padding-left:.32em;font-size:clamp(1rem,calc(var(--fw)*.03),1.6rem);text-shadow:0 0 18px rgba(235,205,140,.45)}
#rev .quote{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.15rem,calc(var(--fw)*.04),2.3rem);line-height:1.3;max-width:24em;min-height:2.6em;text-wrap:balance;text-shadow:0 2px 24px #000}
#rev .by{font-size:.76rem;letter-spacing:.38em;padding-left:.38em;text-transform:uppercase;color:var(--gold);opacity:0;transition:opacity 1.6s var(--ease)}
#rev .by.on{opacity:1}

/* intertitles and the endings */
#say{gap:clamp(10px,calc(var(--fw)*.03),28px)}
.s{opacity:0;filter:blur(6px);transform:translateY(8px);transition:opacity 1.5s var(--ease),transform 1.5s var(--ease),filter 1.5s var(--ease)}
.s.on{opacity:1;filter:blur(0);transform:none;transition-duration:2.4s}
.s.it{font-style:italic;text-transform:none;letter-spacing:.01em;padding-left:0;font-size:clamp(1.15rem,calc(var(--fw)*.033),2rem);line-height:1.35}
.s.big{text-transform:none;letter-spacing:.003em;padding-left:0;font-weight:300;font-size:clamp(1.3rem,calc(var(--fw)*.047),2.7rem);line-height:1.28;text-shadow:0 2px 24px #000}
.s.big.soft{color:var(--dim)}
body.reduced .s{filter:none;transform:none}
#cap{justify-content:flex-end;padding-bottom:7%}
.btn{display:none;margin-top:clamp(8px,calc(var(--fw)*.03),26px);padding:16px 22px 16px calc(22px + .42em);font-size:.78rem;letter-spacing:.42em;text-transform:uppercase;border:1px solid rgba(205,187,142,.5);color:var(--ivory);background:rgba(5,7,10,.25);opacity:0;visibility:hidden;transition:opacity 1.6s var(--ease),visibility 0s 1.6s,background .6s}
.btn.show{display:block}
.btn.on{opacity:1;visibility:visible;transition:opacity 2.4s var(--ease),visibility 0s,background .6s}
.btn:hover{background:rgba(205,187,142,.12)}
noscript{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:2rem;font-family:var(--serif);font-size:1.4rem}
@media (max-width:640px){
  .top{font-size:.66rem;letter-spacing:.26em}
  .top .left .scn{display:none}
}
@media (prefers-reduced-motion:reduce){.cta .ring{animation:none}}
</style>
</head>
<body class="intro">
<canvas id="stage" aria-hidden="true"></canvas>
<div id="ui">
  <header class="top">
    <div class="left"><b id="chap">Chapter Two</b><br><span class="scn" id="scn">Critics ask what it means.</span></div>
    <div class="right">
      <button id="snd" type="button" aria-pressed="true" aria-label="Toggle sound">Sound on</button>
      <button id="restartTop" type="button">Restart</button>
    </div>
  </header>

  <div id="card">
    <section class="scr opening" id="intro">
      <p>Chapter One asked what a film creates.</p>
      <h1>Critics ask<br>what it means.</h1>
      <p>Try it.</p>
      <button class="cta" id="cta" type="button" aria-label="Start the film">
        <span class="ring" aria-hidden="true"></span>
        <span class="t1">Start the film</span>
        <span class="t2">Click to begin</span>
      </button>
    </section>

    <section class="scr opening" id="intro3">
      <p>You are the audience.</p>
      <h1>The canon decides<br>what matters.</h1>
      <button class="cta" id="cta3" type="button" aria-label="Start Chapter Three" tabindex="-1">
        <span class="ring" aria-hidden="true"></span>
        <span class="t1">Start the film</span>
        <span class="t2">Click to begin</span>

    </section>

    <section class="scr" id="ask" aria-label="Question">
      <p class="q" id="q"></p>
      <div class="opts" id="opts"></div>
    </section>

    <section class="scr" id="rev" aria-hidden="true">
      <p class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</p>
      <p class="quote" id="quote"></p>
      <p class="by" id="by">&mdash; You</p>
    </section>

    <section class="scr" id="say">
      <button class="btn" id="again" type="button" tabindex="-1">Watch it again</button>
    </section>

    <div class="scr" id="cap" aria-hidden="true"></div>
  </div>

  <div class="bottom">
    <div id="prog" role="progressbar" aria-label="Progress through the chapter" aria-valuemin="1" aria-valuemax="8" aria-valuenow="1">
      <div class="bar" id="pbar"><div class="fill" id="fill"></div></div>
      <div class="lbl" id="lbl">01 / 08 · The Film</div>
    </div>
  </div>
  <div class="sr" id="live" aria-live="polite"></div>
</div>
<noscript>This exhibition needs JavaScript to run.</noscript>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#stage'),ctx=cv.getContext('2d',{alpha:false});
let reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change',e=>{reduce=e.matches;document.body.classList.toggle('reduced',reduce)});
document.body.classList.toggle('reduced',reduce);
const coarse=matchMedia('(pointer: coarse)').matches;
const SERIF='"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif';
const SANS='"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif';
const NEXT_CHAPTER='chapter4.html'; // the last chapter; the closing button leads there

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const eio=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const prog=(x,a,b)=>clamp((x-a)/(b-a),0,1);
const rgb=(r,g,b,a=1)=>`rgba(${r|0},${g|0},${b|0},${clamp(a,0,1).toFixed(3)})`;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const tween=(o,target,dur,dt)=>{const d=target-o.v,st=dt/dur;o.v+=clamp(d,-st,st)};
const smooth=(v,t,rate,dt)=>v+(t-v)*(1-Math.exp(-dt*rate));

/* ---------- the room and the film's own time ---------- */
const R={W:2.9,D:6.5,H:3.1};
const DOOR={x0:-2.25,x1:-1.35,h:2.05},WIN={x0:.95,x1:2.25,y0:.95,y1:2.2},LAMP={x:1.6,y:2.32,z:3.5},CH={x:.45,z:3.9};
const NEAR=.2,END=27.5,STEP=.52,OPEN=1.25;
/* story seconds: the one action the film ever shows. He enters, sits, looks at the window, leaves. */
const TL={open1:[1.0,2.3],enter:[2.3,4.0],close1:[4.1,5.3],walk:[5.3,8.9],turn:[8.9,9.6],sit:[9.6,10.8],look:[11.0,12.2],
  unlook:[15.6,16.2],rise:[16.2,17.4],back:[17.6,21.0],open2:[20.4,21.6],out:[21.7,23.3],close2:[23.5,24.7]};
/* what is shown, and when. The film itself is the same every time; only what lies over it changes. */
const CLIPS={film:{T0:0,T1:END},read1:{T0:8,T1:18},read2:{T0:14.5,T1:24.5},split:{T0:7,T1:19},loop:{T0:0,T1:END}};
const STEPS2=['The Film','First Question','Your Reading','Second Question','Your Reading, Again','Your Review','Side by Side','What Remains'];
const STEPS3=['The Premiere','Fifty Years','The Layers','The Film'];
const Q1={q:'Why did he enter the room?',opts:[['He was looking for someone.','wait'],['He wanted to be alone.','alone'],['He was afraid of something outside.','fear'],['There was no reason.','none']]};
const Q2={q:'What was this film about?',caps:3,opts:[['Loneliness','loneliness'],['Fear','fear'],['Waiting','waiting'],['Memory','memory'],['Death','death'],['Nothing','nothing']]};
/* the review is assembled from the two answers: the second sets the claim, the first supplies the image */
const REV2={loneliness:'A haunting study of loneliness.',fear:'A quiet masterpiece of dread.',waiting:'A haunting study of waiting.',
  memory:'A meditation on memory and the rooms it keeps.',death:'An elegy that never names its dead.',nothing:'A rigorous study of nothing.'};
const REV1={wait:'Every closed door is someone who never came.',alone:'The empty chair is the only company he can bear.',
  fear:'The dark window looks back at him.',none:'He enters for no reason, and that is the reason.'};
const label=(Q,v)=>(Q.opts.find(o=>o[1]===v)||Q.opts[0])[0];
const reviewText=()=>REV2[S.q2]+' '+REV1[S.q1];

/* ---------- Chapter Three: fifty years of honours, each one resting on the one beneath ----------
   bottom to top. Each card's last line is its reason, and the reason is always the card under it.
   The bottom card is the review from Chapter Two, and its reason is two answers that are not on the screen. */
const Y0=1974,Y1=2026,HY=[1974.25,1984,2004,2014,2024];
const CARDS=[
  {id:'review', hn:0,d:0,  cx:.5, cy:.56,cw:.68,ch:.42,rot:-.02},
  {id:'prize',  hn:0,d:.55,cx:.46,cy:.5, cw:.6, ch:.56,rot:.035},
  {id:'retro',  hn:1,d:0,  cx:.54,cy:.47,cw:.58,ch:.6, rot:-.04},
  {id:'restore',hn:2,d:0,  cx:.48,cy:.5, cw:.62,ch:.64,rot:.025},
  {id:'poll',   hn:3,d:0,  cx:.53,cy:.46,cw:.58,ch:.68,rot:-.03},
  {id:'book',   hn:4,d:0,  cx:.49,cy:.5, cw:.6, ch:.74,rot:.045}];
const CLAP=[[.45,2.6],[.6,3],[.75,3.2],[.9,3.6],[1,5]],DROP=.6;

/* ---------- state ---------- */
let S,runId=0;
const waits=[],PARTS=[],ST=new Map(),SCR=[{x:.23,p:.34,on:false,a:0},{x:.71,p:.2,on:false,a:0}];
function fresh(){
  return{mode:'intro',ch:2,mt:0,clock:0,step:0,lastStep:-1,
    clip:null,rt:0,dur:0,pt:0,T:0,playing:false,holdEnd:false,loop:false,fade:0,lead:-1,cut:0,
    q1:null,q2:null,dim:{v:0},dimT:0,out:{v:0},outT:0,split:{v:0},splitT:0,lumS:.1,
    year:Y0,yearT:Y0,hon:0,landT:[0,0,0,0,0],railA:0,railT:0,dragging:false,dragged:false,hint:0,
    cards:CARDS.map(c=>({...c,t:null,landed:false,gone:false,fly:null,back:0})),drag:null,peeled:0,lastPeel:-1e9,rsn:0,rg:0,
    shake:0,ovEnd:0,clap:0,clapT:0,clapEnd:0,mur:0,murT:0,turnN:0,premT:0,held:null,
    prev:{},fr:{i:-1,wx:0,wy:0,fl:0,gx:0,gy:0,dust:[],hair:null}};
}
S=fresh();
function wait(s){const id=runId;return new Promise(res=>waits.push({t:S.clock+s,res,id}))}
function until(fn){const id=runId;return new Promise(res=>waits.push({fn,res,id}))}
function setMode(m){S.mode=m;S.mt=0}

/* ---------- canvas, layout, the front row ---------- */
let W=0,H=0,DPR=1,quality=1,bgGrad,vigGrad,grainPat,pitch=90,K=150,FW=640,FH=480,TOP=60,BARY=0,BARW=300;
const FR={x:0,y:0,w:640,h:480},HEADS=[];let VIS=[];
const BARH=50;
function getSt(key){
  let st=ST.get(key);
  if(!st){let h=7;for(const c of key)h=(h*31+c.charCodeAt(0))|0;const r=mulberry(h^0x5bd1e995);
    st={slump:.15,attn:0,turn:0,phone:0,ov:0,lk:0,away:0,awayV:0,tdir:r()<.5?-1:1,d:r(),r1:r(),r2:r(),ph:r()*6.28,sleep:0,stepT:0,ti:0,
      pre:false,c2:false,arrE:1,left:0,back:0,gone:0,hs:0};
    st.pre=r()<.55;st.arrE=1+Math.min(3,Math.floor(r()*4));st.c2=r()<.7;
    st.away=(S.ch===2?st.c2:st.pre)?0:1;
    ST.set(key,st)}
  return st;
}
function attach(){for(const h of HEADS)h.st=getSt(h.key)}
function resize(){
  DPR=Math.min(devicePixelRatio||1,1.75)*quality;
  W=Math.max(innerWidth,320);H=Math.max(innerHeight,240);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  pitch=clamp(Math.min(W/10.5,H/7.6),50,110);K=pitch/.6;
  TOP=clamp(H*.085,46,80);
  const bot=K*.66+10+BARH,avail=Math.max(120,H-TOP-bot);
  FH=Math.round(Math.min(avail,(W-32)*.75));FW=Math.round(FH*4/3);
  FR.x=Math.round((W-FW)/2);FR.y=Math.round(TOP+(avail-FH)/2);FR.w=FW;FR.h=FH;
  const c=$('#card').style;c.left=FR.x+'px';c.top=FR.y+'px';c.width=FW+'px';c.height=FH+'px';
  $('#card').style.setProperty('--fw',FW+'px');
  BARY=Math.round(FR.y+FH+Math.min(30,BARH*.55));BARW=Math.min(FW*.86,560);
  bgGrad=ctx.createLinearGradient(0,0,0,H);bgGrad.addColorStop(0,'#070a10');bgGrad.addColorStop(1,'#040507');
  vigGrad=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.hypot(W,H)*.62);
  vigGrad.addColorStop(0,'rgba(0,0,0,0)');vigGrad.addColorStop(1,'rgba(0,0,0,.62)');
  if(!grainPat){const n=document.createElement('canvas');n.width=n.height=256;const g=n.getContext('2d'),im=g.createImageData(256,256),r=mulberry(3);
    for(let i=0;i<256*256;i++){const v=r()<.5?0:255;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=r()*34}
    g.putImageData(im,0,0);grainPat=ctx.createPattern(n,'repeat')}
  // the row in front of you; who is sitting in it depends on the year

/* ---------- the stack on the screen ---------- */
function cardGeom(cd){return{x:FR.x+cd.cx*FW,y:FR.y+cd.cy*FH,w:cd.cw*FW,h:cd.ch*FH}}

  if(cd.t===null||cd.t<0)return null;const u=cd.t/DROP;

}
const topCard=()=>{for(let i=S.cards.length-1;i>=0;i--){const c=S.cards[i];if(!c.gone&&c.landed)return c}return null};
function drawCardAt(cd,ox,oy,rot,lift,alpha){
  const g=cardGeom(cd),tc=S.mode==='peel'&&cd===topCard()&&!S.drag?1:S.mode==='peel'&&S.drag&&S.drag.cd===cd?.6:0;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(g.x+ox,g.y+oy);ctx.rotate(cd.rot+rot);ctx.scale(lift,lift);
  heavy(ctx,()=>{ctx.fillStyle='#000';ctx.fillRect(-g.w/2,-g.h/2,g.w,g.h)},lift>1?1.6:1);
  cardBody(ctx,cd.id,g.w,g.h,tc);
  ctx.restore();
}
function drawStack(){
  const m=S.mode;if(S.ch!==3||m==='intro3')return;

  for(const cd of S.cards){
    if(cd.fly){const f=cd.fly;drawCardAt(cd,f.x,f.y,f.rot,1.04,a*(1-sstep(.7,1.4,f.t)));continue}
    if(cd.gone)continue;
    const dy=dropY(cd);if(dy===null)continue;
    const dr=S.drag&&S.drag.cd===cd?S.drag:null,breath=m==='peel'&&cd===topCard()&&!dr?.004*Math.sin(S.clock*2.2):0;
    drawCardAt(cd,dr?dr.dx:cd.back*cd.bx||0,(dr?dr.dy:cd.back*cd.by||0)+dy,dr?dr.dx*.0007:0,dr?1.035:1+breath,a);
  }
}
function hitCard(cd,x,y){const g=cardGeom(cd),dx=x-g.x,dy=y-g.y,c=Math.cos(cd.rot),s=Math.sin(cd.rot),lx=dx*c+dy*s,ly=-dx*s+dy*c;return Math.abs(lx)<g.w/2&&Math.abs(ly)<g.h/2}

}
function peel(cd,dx,dy){ // the card comes away in the direction it was pulled, and falls past the row
  let l=Math.hypot(dx,dy);if(l<8){dx=(cd.cx<.5?-1:1)*.55;dy=-.85;l=1}
  const sp=FH*2.4;cd.gone=true;cd.back=0;

  for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.t+=dt;if(p.t>p.life){PARTS.splice(i,1);continue}
    p.vx*=Math.exp(-dt*3);p.vy*=Math.exp(-dt*3);p.x+=p.vx*dt;p.y+=p.vy*dt}

/* ---------- the front row ---------- */
function person(h,yT,o,ra){
  const p=h.p,st=h.st,a=st.away,stand=sstep(0,.25,a),walk=sstep(.25,.62,a),ap=sstep(.62,1,a);
  const sl=st.slump*(1-stand),at=st.attn*(1-stand),side=p.dx>=0?1:-1,ov=st.ov*(1-stand);
  const lean=(p.lean*(1-at*.7)+side*.07*sl*(st.sleep?1.8:1))*(1-stand);
  const drop=(.06*sl*(st.sleep?1.5:1)-.022*at-.03*st.lk)*(1-stand),rise=.5*stand+.4*ov;
  const bob=S.clap*.012*Math.sin(S.clock*13+st.ph)*(1-st.turn)+(walk>0&&ap<1?.012*Math.abs(Math.sin(a*48)):0);
  const wx=(W/2-h.x)*walk;
  const hx=h.x+(p.dx+lean)*K+wx,hy=yT-(p.h-.95-drop+rise+bob)*K;
  const shY=yT-(.15+p.sh+rise+bob-.03*sl)*K;
  const pp=new Path2D();
  rr(pp,h.x+(-.235+p.dx*.4+lean*.35)*K+wx,shY,.47*K,(.28+rise*1.3)*K,.11*K,false);
  pp.rect(hx-.045*K,hy,.09*K,shY-hy+.05*K);
  const tw=Math.sin(Math.PI*clamp(st.turn,0,1)),rx=.105*p.s*K*(1-.1*tw),ry=.135*p.s*K;
  pp.moveTo(hx+rx,hy);pp.ellipse(hx,hy,rx,ry,lean*.5,0,6.2832);
  if(p.hair){pp.moveTo(hx+p.hair*rx*.5+rx*.62,hy-ry*.75);pp.ellipse(hx+p.hair*rx*.5,hy-ry*.75,rx*.62,ry*.5,0,0,6.2832)}
  if(tw>.06){const nx=hx+st.tdir*rx*.86,n=.04*K*tw;pp.moveTo(nx,hy-ry*.3);pp.lineTo(nx+st.tdir*n,hy+ry*.1);pp.lineTo(nx,hy+ry*.32);pp.closePath()}
  ctx.save();
  if(ap>0){const ax=W/2,ay=yT+.15*K,sc=1+1.1*ap;ctx.globalAlpha=1-sstep(.35,.9,ap);ctx.translate(ax,ay+ap*K*.7);ctx.scale(sc,sc);ctx.translate(-ax,-ay)}
  if(st.phone>.01)add(()=>glow(hx+side*.05*K,hy+.26*K,.36*K,[[0,rgb(196,210,232,.22*st.phone)],[1,rgb(196,210,232,0)]]));
  ctx.translate(0,-o);ctx.fillStyle=rgb(226,208,164,ra+.1*st.turn);ctx.fill(pp);ctx.translate(0,o);ctx.fillStyle='rgb(3,5,9)';ctx.fill(pp);
  if(st.turn>.3&&a<.01){const f=sstep(.3,1,st.turn);ctx.fillStyle=rgb(226,208,164,.045*f);ctx.beginPath();ctx.ellipse(hx,hy+ry*.08,rx*.82,ry*.8,lean*.5,0,6.2832);ctx.fill()}
  if(st.turn>.6&&a<.01){const f=sstep(.6,1,st.turn)*(.24+.3*S.lumS),er=Math.max(.7,.0075*K);ctx.fillStyle=rgb(236,226,200,f);
    for(const sx of[-1,1]){ctx.beginPath();ctx.arc(hx+sx*rx*.36,hy-ry*.04,er,0,6.2832);ctx.fill()}}
  ctx.restore();
}
function drawHeads(){
  const yT=H-K*.12,o=clamp(.012*K,.7,3),ra=clamp(.05+.62*S.lumS,0,.8),sw=.52*K,rad=Math.min(.1*K,sw/2);
  const sp=new Path2D(),walkers=[];
  for(const s of HEADS)rr(sp,s.x-.26*K,yT,sw,K*.3,rad,true);
  for(const h of HEADS){if(h.st.away>=1)continue;if(h.st.away>.62){walkers.push(h);continue}person(h,yT,o,ra)}
  ctx.save();ctx.translate(0,-o);ctx.fillStyle=rgb(170,170,160,ra*.62);ctx.fill(sp);ctx.translate(0,o);ctx.fillStyle='rgb(8,11,18)';ctx.fill(sp);ctx.restore();
  for(const h of walkers)person(h,yT,o,ra);
}
function go(h,dir,speed){const st=h.st;st.awayV=dir>0?1/(speed||7):-1/(speed||6);if(dir>0||st.away<.3)sndSeat(h.x)}
/* what the row does: in Chapter Two it just watches; in Chapter Three it is bored, then devout, then turns on you, then decides for itself */
function direct(dt){
  const all=HEADS.slice().sort((a,b)=>Math.abs(a.x-W/2)-Math.abs(b.x-W/2));
  VIS=all.filter(h=>h.st.away<1||h.st.awayV);
  const pre=all.filter(h=>h.st.pre),n=VIS.length,m=S.mode,t=S.mt,E=S.hon;
  VIS.slice().sort((a,b)=>a.st.r2-b.st.r2).forEach((h,i)=>{h.st.ti=i});
  S.turnN=m==='peel'?Math.min(n,Math.round(n*clamp(S.peeled/6*1.15,0,1))):0;
  let mur=0;
  const premiere=m==='premiere'||(m==='years'&&E===0),pt=S.clock-S.premT,looking=S.T>TL.look[0]&&S.T<TL.unlook[0];
  for(const h of all){
    const st=h.st,i=pre.indexOf(h),role=i===1?'leaver':i===2?'phone':i===3?'sleeper':i===4?'phone2':'';
    let sl=.15,at=0,ph=0,tn=0,ov=0,lk=0;
    if(S.ch===2){sl=.12}
    else if(premiere){
      sl=(.4+.5*st.r1)*sstep(1+st.d*5,3+st.d*5,pt);
      if(role==='sleeper'&&pt>7.5){sl=1;st.sleep=1}
      if(role==='phone'&&pt>4)ph=1;
      if(role==='leaver'&&pt>6.5&&!st.left){st.left=1;go(h,1)}
      mur=.16+.22*sstep(2,9,pt);
    }else if(m==='years'){
      st.sleep=0;at=1;sl=0;ov=S.clock<S.ovEnd&&S.clock>S.landT[4]+DROP&&st.r1>.3?1:0;
      const due=st.pre?(st.left&&E>=1):E>=st.arrE;
      if(due&&!st.back&&st.away>0&&S.clock>S.landT[st.pre?0:st.arrE-1]+DROP+.4+st.d*2.2){st.back=1;go(h,-1)}
    }else if(m==='peel'){at=1;sl=0;tn=st.ti<S.turnN?1:0;const busy=S.clock-S.lastPeel<4;mur=(busy?.1+.4*S.peeled/6:.04+.12*S.peeled/6)}
    else if(m==='after'||m==='handoff'){ // everyone turns back to the screen; each decides for themselves
      at=1;sl=0;tn=t>.6+st.ti*.45?0:st.turn>.5?1:0;
      if(h.key===S.held){ // the one who gets up, and sits down again when he looks at the window
        if(st.hs===0&&t>3&&S.T>7.6&&S.T<9.4){st.hs=1;st.awayV=1/12;sndSeat(h.x)}
        else if(st.hs===1&&S.T>=TL.look[0]+.15){st.hs=2;st.awayV=-1/2.2}
        else if(st.hs===2&&st.away<=0){st.hs=3}
        if(st.hs>=2)lk=looking?1:.4;
      }else if(st.r1<.42){if(!st.gone&&st.away<1&&t>5+st.ti*1.1){st.gone=1;go(h,1)}}
      else lk=looking?1:0;
      mur=t<2?.06:0;
    }
    st.slump=smooth(st.slump,sl,1.3,dt);st.attn=smooth(st.attn,at,1.6,dt);st.phone=smooth(st.phone,ph,2.5,dt);
    st.turn=smooth(st.turn,tn,1.7,dt);st.ov=smooth(st.ov,ov,2.2,dt);st.lk=smooth(st.lk,lk,2,dt);
    if(st.awayV){st.away=clamp(st.away+st.awayV*dt,0,1);if(st.away<=0||st.away>=1)st.awayV=0;
      if(st.away>.27&&st.away<.97&&S.clock>st.stepT){st.stepT=S.clock+.5;sndStep(h.x)}}
  }
  S.murT=mur;
}

/* ---------- audio ---------- */
const A={ctx:null,out:null,duck:null,vin:null,proj:null,white:null,mur:null,am:null,on:true,last:-1,lastP:-1,lastM:-1,nextAM:0,nextCough:0};
function audioInit(){
  if(A.ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=A.ctx=new AC(),m=A.out=c.createGain();m.gain.value=0;A.duck=c.createGain();m.connect(A.duck).connect(c.destination);
  // the narrator: a little compression, then the hall it is heard in
  {const vin=A.vin=c.createGain(),hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=80;
    const cmp=c.createDynamicsCompressor();cmp.threshold.value=-20;cmp.ratio.value=3;cmp.attack.value=.005;cmp.release.value=.25;
    const ir=c.createBuffer(2,c.sampleRate*2.4|0,c.sampleRate);
    for(let k=0;k<2;k++){const d=ir.getChannelData(k);for(let i=0;i<d.length;i++){const t=i/c.sampleRate;d[i]=(Math.random()*2-1)*Math.exp(-t*3.2)*(t<.015?t/.015:1)}}

/* ---------- Chapter Three ---------- */
async function run3(){

  caption('The film that you watched in Chapter Two.',4.6);speak('ch3_watched');

  const cand=VIS.filter(h=>h.st.r1>=.42&&h.st.away<1);S.held=cand[0]?cand[0].key:null;
  setMode('after');setStep(3);
  live('The row turns back to the screen and looks at the film itself. Some get up and leave. One stands, and sits down again when the man looks toward the window. Others stay.');
  await until(()=>!S.held||!ST.get(S.held)||ST.get(S.held).hs===3||S.mt>32);
  await wait(2.5);
  S.dimT=1;
  const els=await say(['None of this would be here without a reading. The first one was yours.','A film does not owe us an explanation. Nor do we owe it admiration.','Audiences can judge a film again and again.'],{cls:['big soft','big','big soft'],gap:3.8,hold:5,keep:true});
  for(const e of els)e.classList.remove('on');
  setMode('handoff');S.outT=1;
  await wait(3.4);S.playing=false;for(const e of els)e.remove();
  document.body.classList.add('final');
  await say(['Tonight, the greatest director of all time premieres his new film.'],{cls:'big',hold:3,keep:true});
  again.textContent=NEXT_CHAPTER?'Continue':'Watch it again';
  again.classList.add('show');void again.offsetWidth;again.classList.add('on');again.tabIndex=0;
}

function start(){
  if(S.mode!=='intro')return;
  document.body.classList.remove('intro');$('#restartTop').classList.add('on');
  if(A.on){audioInit();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume()}
  run2();
}
function start3(){
  if(S.mode!=='intro3')return;
  document.body.classList.remove('intro3');$('#cta3').tabIndex=-1;
  if(A.on){audioInit();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume()}
  run3();
}
function clearDom(){
  for(const e of sayEl.querySelectorAll('.s'))e.remove();
  capEl.textContent='';askEl.classList.remove('on','picked','ready');revEl.classList.remove('on');quoteEl.textContent='';byEl.classList.remove('on');
  again.classList.remove('on','show');again.tabIndex=-1;
  document.body.classList.remove('final','intro','intro3');cv.style.cursor='';
  A.last=-1;A.lastP=-1;A.lastM=-1;stopVoice();
}
function restart(){ // from the top of Chapter Two
  runId++;waits.length=0;PARTS.length=0;ST.clear();
  S=fresh();attach();clearDom();
  $('#chap').textContent='Chapter Two';$('#cta3').tabIndex=-1;
  document.body.classList.add('intro');$('#restartTop').classList.remove('on');
  setTimeout(()=>$('#cta').focus({preventScroll:true}),60);
}
function restart3(){ // Chapter Three again, with the same review
  const q1=S.q1,q2=S.q2;
  runId++;waits.length=0;PARTS.length=0;
  S=fresh();S.q1=q1;S.q2=q2;clearDom();toChapter3();
}

/* ---------- input ---------- */
const onRail=(x,y)=>S.mode==='years'&&S.railA>.3&&Math.abs(y-BARY)<30&&x>W/2-BARW/2-24&&x<W/2+BARW/2+24;
function dragTo(x){S.yearT=Math.max(S.yearT,xYear(x));if(S.yearT>S.year+.3)S.dragged=true}
cv.addEventListener('pointerdown',e=>{
  const x=e.clientX,y=e.clientY;
  if(onRail(x,y)){S.dragging=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}dragTo(x);e.preventDefault();return}
  if(S.mode==='peel'){const tc=topCard();if(tc&&hitCard(tc,x,y)){S.drag={cd:tc,sx:x,sy:y,dx:0,dy:0};try{cv.setPointerCapture(e.pointerId)}catch(_){}cv.style.cursor='grabbing';e.preventDefault()}}
});
cv.addEventListener('pointermove',e=>{
  const x=e.clientX,y=e.clientY;
  if(S.dragging){dragTo(x);return}
  if(S.drag){S.drag.dx=x-S.drag.sx;S.drag.dy=y-S.drag.sy;return}
  if(S.mode==='peel'){const tc=topCard();cv.style.cursor=tc&&hitCard(tc,x,y)?'grab':'';return}
  cv.style.cursor=onRail(x,y)?'ew-resize':'';
});
const up=()=>{
  S.dragging=false;const d=S.drag;if(!d)return;
  const l=Math.hypot(d.dx,d.dy);
  if(l>FH*.14||l<6)peel(d.cd,d.dx,d.dy);else{d.cd.bx=d.dx;d.cd.by=d.dy;d.cd.back=1} // not far enough: it settles back
  S.drag=null;cv.style.cursor='';
};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
$('#cta').addEventListener('click',start);
$('#cta3').addEventListener('click',start3);
$('#restartTop').addEventListener('click',restart);
again.addEventListener('click',()=>{if(NEXT_CHAPTER)location.href=NEXT_CHAPTER;else restart3()});
$('#snd').addEventListener('click',()=>setSound(!A.on));
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(askEl.classList.contains('ready')&&!askEl.classList.contains('picked')){const n=parseInt(e.key,10);if(n>=1&&n<=optsEl.children.length){e.preventDefault();optsEl.children[n-1].click()}return}
  if(S.mode==='years'&&(e.key==='ArrowRight'||e.key==='ArrowUp')){e.preventDefault();S.yearT=Math.min(Y1,Math.max(S.yearT,S.year)+3);S.dragged=true}
  if(S.mode==='peel'&&(e.code==='Space'||e.key===' ')&&!e.repeat){e.preventDefault();const tc=topCard();if(tc&&!S.drag)peel(tc,0,0)}
});
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{lastT=0;if(A.ctx){if(document.hidden)A.ctx.suspend();else if(A.on)A.ctx.resume()}});

/* ---------- DOM state ---------- */
let tickFor=0;
function updateDom(){
  if(S.step===S.lastStep)return;S.lastStep=S.step;
  const L=S.ch===2?STEPS2:STEPS3,nm=L[S.step]||L[0],intro=S.mode==='intro'||S.mode==='intro3';
  $('#lbl').textContent=String(S.step+1).padStart(2,'0')+' / '+String(L.length).padStart(2,'0')+' · '+nm;
  $('#scn').textContent=intro?(S.ch===2?'Critics ask what it means.':'The canon decides what matters.'):nm;
  $('#fill').style.width=((S.step+1)/L.length*100)+'%';
  $('#prog').setAttribute('aria-valuenow',String(S.step+1));$('#prog').setAttribute('aria-valuemax',String(L.length));
  if(tickFor!==L.length){tickFor=L.length;const bar=$('#pbar');for(const t of bar.querySelectorAll('.tick'))t.remove();
    for(let i=1;i<L.length;i++){const t=document.createElement('i');t.className='tick';t.style.left=(i/L.length*100)+'%';bar.appendChild(t)}}
}

/* ---------- main loop ---------- */
let lastT=0,accum=0,nframes=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!lastT){lastT=ts;return}
  const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;
  accum+=dt;nframes++;
  if(nframes===90){if(accum/90>.028&&quality>.55){quality*=.8;resize()}accum=0;nframes=0}
  tick(dt);
}
function tick(dt){
  update(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#040507';ctx.fillRect(0,0,W,H);
  if(S.shake>0&&!reduce)ctx.translate(S.shake*2.5*Math.sin(S.clock*71),S.shake*3*Math.sin(S.clock*53));
  drawHall();drawFilm();drawStack();drawRail();drawPeelHint();drawParts();drawHeads();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.save();ctx.translate(-S.fr.gx,-S.fr.gy);ctx.globalAlpha=.5;ctx.fillStyle=grainPat;ctx.fillRect(0,0,W+256,H+256);ctx.restore();
  ctx.fillStyle=vigGrad;ctx.fillRect(0,0,W,H);
  updateDom();
}
resize();
requestAnimationFrame(frame);
setTimeout(()=>{if(S.mode==='intro')$('#cta').focus({preventScroll:true})},200);
// arriving from the chapter list at #ch3: start at Chapter Three, with a review written from a default pair of answers
if(location.hash==='#ch3'){S.q1='alone';S.q2='loneliness';document.body.classList.remove('intro');toChapter3();}
})();
</script>

<style>
/* chapter switcher: the chapter name in the top-left opens a short list of all four */
.top .left{position:relative}
.chapsel{cursor:pointer;pointer-events:auto;outline:none;transition:color .6s}
.chapsel::after{content:"";display:inline-block;width:5px;height:5px;margin-left:.8em;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:translateY(-3px) rotate(45deg);opacity:.55;transition:transform .5s cubic-bezier(.22,.61,.36,1)}
.chapsel[aria-expanded="true"]::after{transform:translateY(0) rotate(-135deg)}
.chapsel:hover,.chapsel:focus-visible{color:#cdbb8e}
.chapnav{position:absolute;left:-14px;top:calc(100% + 8px);z-index:30;display:flex;flex-direction:column;min-width:14em;padding:8px 0;background:rgba(5,7,10,.94);border-top:1px solid rgba(205,187,142,.4);pointer-events:auto;
  opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .45s cubic-bezier(.22,.61,.36,1),transform .45s cubic-bezier(.22,.61,.36,1),visibility 0s .45s}
.chapnav.on{opacity:1;visibility:visible;transform:none;transition:opacity .6s cubic-bezier(.22,.61,.36,1),transform .6s cubic-bezier(.22,.61,.36,1),visibility 0s}
.chapnav a{display:block;padding:10px 14px;font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;text-decoration:none;color:rgba(241,232,211,.62);white-space:nowrap;transition:color .5s}
.chapnav a:hover,.chapnav a:focus-visible{color:#f1e8d3;outline:none}
.chapnav a.cur{color:#cdbb8e}
</style>
<script>
(()=>{
  const CH=[['Chapter One','index.html'],['Chapter Two','chapter2-3.html'],['Chapter Three','chapter2-3.html#ch3'],['Chapter Four','chapter4.html']];
  const b=document.querySelector('.top .left b');if(!b)return;const left=b.parentElement;
  b.classList.add('chapsel');b.setAttribute('role','button');b.tabIndex=0;b.setAttribute('aria-haspopup','true');b.setAttribute('aria-expanded','false');b.title='Choose a chapter';
  const nav=document.createElement('nav');nav.className='chapnav';nav.setAttribute('aria-label','Chapters');
  for(const [name,url] of CH){const a=document.createElement('a');a.href=url;a.textContent=name;a.addEventListener('click',e=>{e.preventDefault();go(url);});nav.append(a);}
  left.append(nav);
  const open=on=>{for(const a of nav.children)a.classList.toggle('cur',a.textContent===b.textContent.trim());nav.classList.toggle('on',on);b.setAttribute('aria-expanded',String(on));};
  b.addEventListener('click',e=>{e.stopPropagation();open(!nav.classList.contains('on'));});
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();open(!nav.classList.contains('on'));}});
  addEventListener('pointerdown',e=>{if(!left.contains(e.target))open(false);},true);
  addEventListener('keydown',e=>{if(e.key==='Escape')open(false);});
  // Chapters Two and Three share a page; switching between them reloads it with or without #ch3
  function go(url){const u=new URL(url,location.href);
    if(u.pathname!==location.pathname){location.href=url;return;}
    try{history.replaceState(null,'',u.pathname+u.search+u.hash);location.reload();}catch(e){location.href=url;}}
})();
</script>
