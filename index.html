<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<title>Nothing Is Profound</title>
<meta name="description" content="Chapter One of an interactive exhibition: a camera follows one point of light through a cinema in four takes.">
<meta name="theme-color" content="#05070a">
<style>
:root{color-scheme:dark;
  --ink:#05070a; --ivory:#f1e8d3; --gold:#cdbb8e; --dim:rgba(241,232,211,.66); --rule:rgba(205,187,142,.5); --rec:#d0473a;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--ivory);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans)}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
#tv{position:fixed;inset:0;pointer-events:none;display:none;
  background:
    repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 1px,transparent 1px,transparent 3px),
    repeating-linear-gradient(to right,rgba(255,60,40,.025) 0,rgba(255,60,40,.025) 1px,rgba(40,255,90,.02) 1px,rgba(40,255,90,.02) 2px,rgba(60,90,255,.025) 2px,rgba(60,90,255,.025) 3px),
    radial-gradient(ellipse 120% 110% at 50% 50%,transparent 58%,rgba(0,0,0,.58) 100%)}
body.tv #tv{display:block}

#vf{position:fixed;inset:max(64px,9vh) clamp(16px,4vw,56px) max(78px,12vh);pointer-events:none;transition:opacity 1.6s var(--ease)}
#vf i{position:absolute;width:26px;height:26px;border:0 solid rgba(241,232,211,.55)}
#vf i:nth-child(1){left:0;top:0;border-left-width:1px;border-top-width:1px}
#vf i:nth-child(2){right:0;top:0;border-right-width:1px;border-top-width:1px}
#vf i:nth-child(3){left:0;bottom:0;border-left-width:1px;border-bottom-width:1px}
#vf i:nth-child(4){right:0;bottom:0;border-right-width:1px;border-bottom-width:1px}
#vf .cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;opacity:.35}
#vf .cross::before,#vf .cross::after{content:"";position:absolute;background:var(--ivory)}
#vf .cross::before{left:8.5px;top:0;width:1px;height:18px}#vf .cross::after{top:8.5px;left:0;height:1px;width:18px}
#vf .info{position:absolute;bottom:10px;font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;color:rgba(241,232,211,.78);text-shadow:0 0 6px #000;white-space:nowrap}
#vf .l{left:14px}#vf .r{right:14px}
#vf .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rec);margin-right:7px;vertical-align:0;box-shadow:0 0 8px rgba(208,71,58,.8)}
body.stby #vf .dot{background:transparent;border:1px solid rgba(241,232,211,.6);box-shadow:none}
body.rec #vf .dot{animation:blink 1.6s steps(1) infinite}
body.hold #vf .dot{animation:none}
@keyframes blink{0%{opacity:1}50%{opacity:.25}}
body.final #vf .cross,body.dark #vf .cross{opacity:0}
body.dark #vf i{border-color:rgba(26,28,32,.5)}body.dark #vf .info{color:#1a1c20;text-shadow:none}

#ui{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;pointer-events:auto}
button:focus-visible{outline:1px solid var(--gold);outline-offset:5px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(18px,env(safe-area-inset-top)) clamp(16px,3vw,36px) 0;font-size:.74rem;letter-spacing:.34em;text-transform:uppercase;color:var(--dim)}
.top .left{line-height:1.9}
.top .left b{font-weight:400;color:var(--ivory)}
.top .right{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.top button{padding:10px 10px;letter-spacing:.34em;text-transform:uppercase;font-size:.74rem;color:var(--dim)}
.top button:hover{color:var(--ivory)}
#restartTop{opacity:0;visibility:hidden;transition:opacity 1.6s var(--ease)}
#restartTop.on{opacity:1;visibility:visible}
#prog{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(420px,calc(100% - 32px));font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);transition:opacity 2s var(--ease)}
#prog .bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
#prog .bar i{height:1px;background:rgba(241,232,211,.18);position:relative;overflow:hidden}
#prog .bar i b{position:absolute;inset:0;width:0;background:var(--gold)}
#prog .lbl{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.intro #prog{opacity:0}
body.dark .top,body.dark .top button,body.dark #prog{color:#1a1c20}
body.dark #prog .bar i{background:rgba(20,22,26,.25)}

#intro{position:absolute;left:0;right:0;top:clamp(70px,11vh,120px);text-align:center;padding:0 6vw;transition:opacity 2.2s var(--ease)}
#intro .eyebrow{display:block;font-family:var(--mono);font-size:.76rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
#intro h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.1rem,5.4vw,4.8rem);line-height:1.04;letter-spacing:.005em;text-shadow:0 2px 40px #000;text-wrap:balance}
#intro p{margin-top:clamp(10px,1.8vh,20px);font-family:var(--serif);font-style:italic;font-size:clamp(1rem,1.7vw,1.4rem);color:var(--dim);text-wrap:balance}
body:not(.intro) #intro{opacity:0}
#cta{position:absolute;left:0;top:0;transform:translate(-50%,-30px);display:flex;flex-direction:column;align-items:center;gap:12px;transition:opacity 2s var(--ease);padding:6px;width:min(24rem,86vw)}
#cta .ring{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid rgba(235,214,160,.75);box-shadow:0 0 22px 2px rgba(235,205,140,.35),inset 0 0 14px rgba(235,205,140,.3);animation:breathe 4.4s ease-in-out infinite}
#cta .ring::after{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--rec);box-shadow:0 0 14px 3px rgba(208,71,58,.6)}
#cta .t1{font-size:.78rem;letter-spacing:.42em;text-transform:uppercase;color:var(--ivory);padding-left:.42em;text-shadow:0 0 12px #000}
#cta .t2{font-family:var(--serif);font-style:italic;font-size:.98rem;line-height:1.35;color:var(--dim);text-align:center;text-shadow:0 0 12px #000,0 0 4px #000;text-wrap:balance}
body:not(.intro) #cta{opacity:0;pointer-events:none;visibility:hidden;transition:opacity 1.2s,visibility 0s 1.2s}
@keyframes breathe{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}

#shade{position:absolute;left:0;right:0;bottom:0;height:44%;background:linear-gradient(to top,rgba(2,3,5,.82),rgba(2,3,5,.45) 55%,transparent);opacity:0;transition:opacity 1.6s var(--ease)}
#shade.on{opacity:1}
.line{position:absolute;left:50%;width:min(92vw,56rem);transform:translate(-50%,8px);text-align:center;font-family:var(--serif);opacity:0;filter:blur(6px);visibility:hidden;text-wrap:balance;
  transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease),visibility 0s .9s}
.line.on{opacity:1;transform:translate(-50%,0);filter:blur(0);visibility:visible;transition:opacity 1.2s var(--ease),transform 1.2s var(--ease),filter 1.2s var(--ease),visibility 0s}
.line.sub{bottom:calc(16% + 30px);font-size:clamp(1.15rem,.9rem + 1.5vw,2rem);font-style:italic;line-height:1.35;color:var(--ivory);text-shadow:0 1px 18px #000,0 0 3px rgba(0,0,0,.6)}
.line.std{bottom:calc(24% + 34px);font-size:clamp(.95rem,.8rem + .7vw,1.25rem);font-style:italic;line-height:1.45;color:var(--gold);text-shadow:0 2px 18px #000;transition-duration:2s}
.line.final{bottom:calc(34% + 40px);font-size:clamp(1.3rem,.9rem + 2.2vw,2.7rem);font-weight:300;line-height:1.28;color:var(--ivory);text-shadow:0 2px 24px #000;transition-duration:2s}
body.reduced .line{transform:translate(-50%,0);filter:none}

#act{position:absolute;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 44px);transform:translateX(-50%);width:min(30rem,calc(100% - 32px));display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;opacity:0;visibility:hidden;transition:opacity 1s var(--ease),visibility 0s 1s}
#act.on{opacity:1;visibility:visible;transition:opacity 1.4s var(--ease) .2s,visibility 0s}
#act .tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
#act p{font-family:var(--serif);font-style:italic;font-size:clamp(.98rem,.86rem + .35vw,1.14rem);line-height:1.4;color:var(--dim);text-shadow:0 0 14px #000,0 0 4px #000;text-wrap:balance}
#actBtn{padding:15px 22px 15px calc(22px + .42em);font-size:.78rem;letter-spacing:.42em;text-transform:uppercase;border:1px solid var(--rule);color:var(--ivory);background:rgba(5,7,10,.45);transition:background .6s,border-color .6s}
#actBtn:hover{background:rgba(205,187,142,.14);border-color:rgba(205,187,142,.85)}
#act:not(.on) #actBtn{pointer-events:none}
.cue{position:absolute;left:50%;bottom:calc(16% + 30px);transform:translateX(-50%);font-family:var(--serif);font-style:italic;letter-spacing:.14em;font-size:1.05rem;color:var(--dim);white-space:nowrap;opacity:0;visibility:hidden;transition:opacity 1s var(--ease),visibility 0s 1s}
.cue.on{opacity:1;visibility:visible;transition:opacity 1.2s var(--ease),visibility 0s}
noscript{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:2rem;font-family:var(--serif);font-size:1.4rem}
@media (max-width:640px){
  .top{font-size:.66rem;letter-spacing:.26em}
  .top button{padding:10px 6px;letter-spacing:.2em}
  .top .left .scn{display:none}
  #vf .info{font-size:.66rem;letter-spacing:.06em}
}
@media (prefers-reduced-motion:reduce){#cta .ring{animation:none}body.rec #vf .dot{animation:none}}
</style>

<canvas id="stage" aria-hidden="true"></canvas>
<div id="tv" aria-hidden="true"></div>
<div id="vf" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="cross"></span>
  <span class="info l"><span class="dot"></span><span id="vfL">STBY &middot; CAM A</span></span>
  <span class="info r" id="vfR">35MM &middot; T2.8 &middot; 00:00:00:00</span>
</div>
<div id="ui">
  <div id="shade"></div>
  <header class="top">
    <div class="left"><b>Chapter One</b><br><span class="scn" id="scn">Camera A</span></div>
    <div class="right">
      <button id="tvBtn" type="button" aria-pressed="true">TV on</button>
      <button id="qual" type="button" aria-pressed="true">4K on</button>
      <button id="snd" type="button" aria-pressed="true">Sound on</button>
      <button id="restartTop" type="button">Restart</button>
    </div>
  </header>

  <section id="intro">
    <span class="eyebrow">You are the camera</span>
    <h1>Nothing is profound<br>by default.</h1>
    <p>Somewhere inside, on the screen, there is one point of light. Follow it.</p>
  </section>
  <button id="cta" type="button">
    <span class="ring" aria-hidden="true"></span>
    <span class="t1">Roll camera</span>
    <span class="t2">Opens the doors and walks the camera in. The light is waiting behind the curtain.</span>
  </button>

  <div id="lines"></div>
  <div class="cue" id="cue">Hold this moment.</div>
  <div id="act">
    <span class="tag" id="actTag">Next</span>
    <p id="actNote"></p>
    <button id="actBtn" type="button">Continue</button>
  </div>

  <div id="prog" role="progressbar" aria-label="Take" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1">
    <div class="bar"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>
    <div class="lbl" id="lbl">Take 1 of 4 · The Eye Opens</div>
  </div>
  <div class="sr" id="live" aria-live="polite"></div>
</div>
<noscript>This exhibition needs JavaScript to run.</noscript>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#stage');
const mainCtx=cv.getContext('2d',{alpha:false});
let ctx=mainCtx;
let reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change',e=>{reduce=e.matches;document.body.classList.toggle('reduced',reduce)});
document.body.classList.toggle('reduced',reduce);
const SERIF='"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif';

/* ---------- constants & helpers ---------- */
const L=44, WALL=8.2, CEIL=6.4, SHW=6, SY0=-0.1, SY1=5.3, NEAR=0.25, SCY=2.6;
const ZP=2.9, YP=5.85, OPEN=7.4;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const eio=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo=t=>{t=clamp(t,0,1);return 1-Math.pow(1-t,3)};
const rgb=(r,g,b,a=1)=>`rgba(${r|0},${g|0},${b|0},${a.toFixed(3)})`;
const GOLD=a=>rgb(205,190,150,a);
const floorY=z=>z>6?-0.047*(z-6):0;
const E=(z,up=0)=>floorY(z)+1.62+up;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- the text ---------- */
const TXT={
 l1:'Before you admire it, look.',
 l2:'Stay with the image.',
 l7:'A pause must create tension, anticipation, unease — something.',
 l11:'Nothing is profound<br>by default.',
 l12:'But if it refuses understanding,<br>it must create something in its place.',
 l13:'One standard for every chapter that follows:<br>judge a film by what it creates on screen.',
};
/* Chapter One sets the standard and asks only one thing of you: look.
   Ambiguity and confusion belong to Chapter Two; discomfort, boredom and wasted time to Chapter Three. */
const TAKES=['The Eye Opens','Stay','The Pause','What It Creates'];
const NEXT=[
 null,
 {label:'Roll take 2', note:'Holds the camera on the image. Nothing is explained; see what staying gives you.'},
 {label:'Roll take 3', note:'The light falls toward still water. Everything, the camera included, stops for four seconds.'},
 {label:'Roll take 4', note:'The light leaves the screen, leads the camera through it and shows what it creates.'},
 {label:'Continue · Chapter Two', note:'The camera stops. Next: a short film, and the question of what it means.'},
];
/* the curtain only opens from the middle to both sides: close, change, open */
const REOPEN=[[0,OPEN],[.9,0],[1.0,0],[2.1,OPEN]];
const SC=[0,SCY,L];

/* each take: camera keys [t,x,y,z,aimX,aimY,aimZ], the curtain, the words, and a camera effect tied to the film */
function buildAct(n){
  switch(n){
  case 1:return{T:10,
    cam:[[0,0,1.62,S.z0,0,1.62+.11*-S.z0,0],[3.2,0,1.62,-1.0,0,2.0,20],[6.5,.4,E(9),9,...SC],[10,0,E(18.5),18.5,...SC]],
    trav:[[0,0],[4.4,0],[6.4,OPEN]],
    words:[['l1',5.0,1e9,{y:.86,fs:40}]],
    film:film1,fx:t=>({})};
  case 2:return{T:10,
    cam:[[0,0,E(18.5),18.5,...SC],[2.2,0,E(18.6),18.6,...SC],[10,0,E(22.5,.15),22.5,...SC]],
    trav:REOPEN,
    words:[['l2',2.4,6.2,{y:.18,fs:46}]],
    film:film2,fx:fx2};
  case 3:return{T:6.5,
    cam:[[0,0,E(22.5,.15),22.5,...SC],[2.0,0,E(23,1.2),23,...SC],[4.0,1.2,E(26,1.8),26,0,1.6,L],[6.5,0,E(28,.3),28,...SC]],
    trav:REOPEN,
    words:[['l7',2.2,1e9,{y:.18,fs:32}]],
    film:film4,fx:fx4,pauseAt:4.0,impact:4.4};
  case 4:{
    const cover=PW*Math.max(W/PW,H/PH);S.zF=clamp(L-2*SHW*F0/cover,30,42.6);
    return{T:13,
    cam:[[0,0,E(28,.3),28,...SC],[3.4,-.8,E(27,.6),27,...SC],[5.5,0,E(31,.2),31,...SC],[7.0,0,SCY,S.zF,...SC]],
    trav:REOPEN,
    words:[['l11',5.4,1e9,{y:.47,fs:60,w:.52,upright:1}]],
    film:film5,fx:fx5,final:1};}
  }
}
function track(tr,t){
  if(t<=tr[0][0])return tr[0][1];
  for(let i=0;i<tr.length-1;i++){const a=tr[i],b=tr[i+1];if(t<=b[0])return lerp(a[1],b[1],eio((t-a[0])/((b[0]-a[0])||1)))}
  return tr[tr.length-1][1];
}
function camEval(k,t){
  const n=k.length;if(n===1||t<=k[0][0])return k[0];if(t>=k[n-1][0])return k[n-1];
  let i=0;while(t>k[i+1][0])i++;
  const a=k[i],b=k[i+1],h=b[0]-a[0],s=(t-a[0])/h,s2=s*s,s3=s2*s;
  const h00=2*s3-3*s2+1,h10=s3-2*s2+s,h01=-2*s3+3*s2,h11=s3-s2,out=[t];
  for(let d=1;d<7;d++){
    const m0=i===0?0:(b[d]-k[i-1][d])/(b[0]-k[i-1][0]);
    const m1=i+1===n-1?0:(k[i+2][d]-a[d])/(k[i+2][0]-a[0]);
    out.push(h00*a[d]+h10*h*m0+h01*b[d]+h11*h*m1);
  }
  return out;
}

/* ---------- state ---------- */
let S,ACT=null;
function fresh(){return{act:0,at:0,ready:false,readyT:0,t:0,rec:0,ts:1,tsT:1,z0:-6,zF:38,
  px:0,py:0,ptx:0,pty:0,door:0,frozen:false,holdT:0,pauseDone:false,impact:false,reveal:5,
  domOn:{},flood:0,ground:0,beyondT:0,trav:0,luma:.2,blur:0,roll:0,streak:0}}
S=fresh();
const now=()=>performance.now();

/* ---------- geometry of the room ---------- */
const rng=mulberry(20190);
const rows=[];
for(let i=0;i<33;i++){
  const z=6.6+i*1.05,seats=[],dens=.26+rng()*.52;
  for(const sd of[-1,1]){let prev=false;
    for(let j=0;j<9;j++){
      const occ=rng()<dens*(prev?1.25:.82);prev=occ;
      let p=null;
      if(occ){const tall=rng();p={dx:(rng()-.5)*.09,s:.9+rng()*.24,h:1.22+tall*.12,sh:(rng()-.5)*.04,hair:rng()<.3?(rng()<.5?-1:1):0,lean:(rng()-.5)*.05}}
      seats.push({xc:sd*(1.6+j*.6),p});
    }}
  if(z>16.5&&z<20.6)continue;
  rows.push({z,seats});
}
const PILZ=[];for(let z=3.2;z<41;z+=3)PILZ.push(z);
const PANELS=[27.2,30.2,33.4];
const dust=[];{const r=mulberry(9);for(let i=0;i<170;i++)dust.push({x:(r()-.5)*15,y:-1.2+r()*7.4,z:2+r()*41,a:r()*6.28,b:r()*6.28,c:r()*6.28,s:.4+r()*1.2})}

/* ---------- the film on the screen, drawn live ---------- */
const PW=960,PH=432;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const pc=mk(PW,PH),g=pc.getContext('2d'),tvC=mk(PW,PH),tg=tvC.getContext('2d');
const scan=mk(1,3);{const s=scan.getContext('2d');s.fillStyle='rgba(0,0,0,.28)';s.fillRect(0,2,1,1)}
const scanPat=tg.createPattern(scan,'repeat');
const hasFilter='filter' in g;
const INK='#1b1812',INKA=a=>`rgba(27,24,18,${clamp(a,0,1).toFixed(3)})`,LIGHT=a=>`rgba(255,251,238,${clamp(a,0,1).toFixed(3)})`;
const CTR=[PW/2,PH*.45];
function wrapText(text,maxW){
  const out=[];
  for(const para of text.split('<br>')){let cur='';for(const w of para.split(' ')){const t=cur?cur+' '+w:w;if(cur&&g.measureText(t).width>maxW){out.push(cur);cur=w}else cur=t}out.push(cur)}
  return out;
}
function drawWords(t){
  for(const [k,t0,t1,o] of ACT.words){
    const a=sstep(t0,t0+.6,t)*(1-sstep(t1-.45,t1,t));if(a<.01)continue;
    g.save();g.globalAlpha=a;g.font=(o.upright?'300 ':'italic 400 ')+o.fs+'px '+SERIF;g.textAlign='center';g.textBaseline='middle';

const items=[];
function drawWorld(){
  items.length=0;

  for(let i=0;i<rows.length;i++)if(rows[i].z>cam.z-1)items.push([rows[i].z,0,i]);

/* ---------- beyond the screen: the light draws one screen inside another ---------- */
function drawBeyond(flood,ground,tb){
  if(flood<=0)return;
  const a1=flood*(1-ground);
  if(a1>0){
    ctx.save();ctx.globalAlpha=a1;
    const sc=Math.max(W/PW,H/PH),dw=PW*sc,dh=PH*sc;
    ctx.imageSmoothingQuality='high';ctx.drawImage(tvC,(W-dw)/2,(H-dh)/2,dw,dh);ctx.restore();
  }

  ctx.save();ctx.globalAlpha=ground;
  const gg=ctx.createLinearGradient(0,0,0,H);gg.addColorStop(0,'#0d0f14');gg.addColorStop(1,'#07080b');
  ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);
  for(let i=0;i<3;i++){
    const cx=W*(.3+.2*i),cy=H*.5,r=Math.max(W,H)*(.5+.08*i);
    const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,r);rg.addColorStop(0,'rgba(214,194,146,.07)');rg.addColorStop(1,'rgba(214,194,146,0)');
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  }
  const t=S.t;
  for(let i=0;i<70;i++){
    const d=dust[i],layer=1+(i%3),px_=S.px*layer*10,py_=S.py*layer*7;
    const x=((d.x/15+.5)*W+Math.sin(t*.05*d.s+d.a)*18*layer+px_+W*2)%W,y=((d.y+1.2)/7.4*H+Math.sin(t*.04*d.s+d.b)*14*layer+py_+H*2)%H;
    ctx.fillStyle='rgba(236,222,186,'+(.05+.05*layer)+')';ctx.fillRect(x,y,layer*.9,layer*.9);
  }
  const bw=Math.min(W*.76,H*.42*2.2),bh=bw/2.2,N=18,cx=W/2,cy=H*.34;
  ctx.lineWidth=1;ctx.lineJoin='round';
  const rot=tb>4.5?(tb-4.5)*.02:0;
  for(let i=0;i<N;i++){
    const p=clamp((tb-.4-i*.18)/1.4,0,1);if(p<=0)continue;
    const sc=Math.pow(.88,i),ang=i*.082+rot*(i/N),co=Math.cos(ang),si=Math.sin(ang),hw=bw*sc/2,hh=bh*sc/2;
    const pts=[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh],[-hw,-hh]].map(([x,y])=>[cx+x*co-y*si,cy+x*si+y*co]);
    let tot=0;const seg=[];for(let k=0;k<4;k++){const l=Math.hypot(pts[k+1][0]-pts[k][0],pts[k+1][1]-pts[k][1]);seg.push(l);tot+=l}
    let rem=tot*eio(p);ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);let hx=pts[0][0],hy=pts[0][1];
    for(let k=0;k<4&&rem>0;k++){const f=Math.min(1,rem/seg[k]);hx=lerp(pts[k][0],pts[k+1][0],f);hy=lerp(pts[k][1],pts[k+1][1],f);ctx.lineTo(hx,hy);rem-=seg[k]}
    ctx.strokeStyle='rgba(226,208,160,'+(.62-.022*i).toFixed(3)+')';ctx.stroke();
    const next=clamp((tb-.4-(i+1)*.18)/1.4,0,1);
    if(p<1&&(next<=0||i===N-1)){const gl=ctx.createRadialGradient(hx,hy,0,hx,hy,12);gl.addColorStop(0,'rgba(255,246,214,.95)');gl.addColorStop(1,'rgba(255,246,214,0)');ctx.fillStyle=gl;ctx.fillRect(hx-12,hy-12,24,24)}
  }
  // the light comes to rest in the middle of what it drew
  const rest=sstep(3.6,4.6,tb);
  if(rest>0){const r=6+2*Math.sin(t*1.6),gl=ctx.createRadialGradient(cx,cy,0,cx,cy,r*5);gl.addColorStop(0,`rgba(255,246,214,${rest})`);gl.addColorStop(1,'rgba(255,246,214,0)');ctx.fillStyle=gl;ctx.fillRect(cx-r*5,cy-r*5,r*10,r*10)}
  ctx.restore();
}

function bloom(flood){
  const a=.22*(1-flood);if(a<.01)return;
  b1.setTransform(1,0,0,1,0,0);b1.globalCompositeOperation='copy';b1.imageSmoothingQuality='high';
  if('filter' in b1)b1.filter='contrast(2.2) brightness(.85)';
  b1.drawImage(cv,0,0,b1C.width,b1C.height);
  if('filter' in b1)b1.filter='none';
  b2.globalCompositeOperation='copy';b2.imageSmoothingQuality='high';b2.drawImage(b1C,0,0,b2C.width,b2C.height);
  b1.drawImage(b2C,0,0,b1C.width,b1C.height);
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.drawImage(b1C,0,0,cv.width,cv.height);ctx.restore();
}

/* ---------- audio ---------- */
const A={ctx:null,master:null,duck:null,vin:null,on:true,last:-1};
function audioInit(){
  if(A.ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=A.ctx=new AC(),m=A.master=c.createGain();m.gain.value=0;A.duck=c.createGain();m.connect(A.duck).connect(c.destination);
  // the narrator: a little compression, then the hall it is heard in
  const vin=A.vin=c.createGain(),hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=80;
  const cmp=c.createDynamicsCompressor();cmp.threshold.value=-20;cmp.ratio.value=3;cmp.attack.value=.005;cmp.release.value=.25;
  const ir=c.createBuffer(2,c.sampleRate*2.4|0,c.sampleRate);
  for(let k=0;k<2;k++){const d=ir.getChannelData(k);for(let i=0;i<d.length;i++){const t=i/c.sampleRate;d[i]=(Math.random()*2-1)*Math.exp(-t*3.2)*(t<.015?t/.015:1)}}
  const rv=c.createConvolver();rv.buffer=ir;const dry=c.createGain(),wet=c.createGain();dry.gain.value=.95;wet.gain.value=.16;
  vin.connect(hp).connect(cmp);cmp.connect(dry).connect(c.destination);cmp.connect(rv).connect(wet).connect(c.destination);
  const len=c.sampleRate*3,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2}
  const src=c.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;
  const ng=c.createGain();ng.gain.value=.55;src.connect(lp);lp.connect(ng);ng.connect(m);src.start();
  const mkOsc=(f,gn)=>{const o=c.createOscillator();o.frequency.value=f;const og=c.createGain();og.gain.value=gn;o.connect(og);og.connect(m);o.start();return og};
  const h1=mkOsc(54,.035);mkOsc(108.4,.012);
  const lfo=c.createOscillator();lfo.frequency.value=.31;const lg2=c.createGain();lg2.gain.value=.012;lfo.connect(lg2);lg2.connect(h1.gain);lfo.start();
}
function audioTone(f,dur,gn){
  if(!A.ctx||!A.on||S.frozen)return;
  const c=A.ctx,o=c.createOscillator(),e=c.createGain();o.frequency.value=f;o.type='sine';
  e.gain.setValueAtTime(0,c.currentTime);e.gain.linearRampToValueAtTime(gn,c.currentTime+.3);e.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
  o.connect(e);e.connect(A.master);o.start();o.stop(c.currentTime+dur+.1);
}
function audioUpdate(){
  if(!A.ctx)return;
  const tgt=A.on&&!S.frozen?.5:0;
  if(tgt!==A.last){A.last=tgt;A.master.gain.setTargetAtTime(tgt,A.ctx.currentTime,tgt?.6:.2)}
}
/* recorded narration, played through the hall; the room's own sound dips under it */
const VOX={raw:{},buf:{},src:null};
for(const id of['ch1_look'])VOX.raw[id]=fetch('voice/'+id+'.mp3').then(r=>r.ok?r.arrayBuffer():null).catch(()=>null);
async function speak(id){
  if(!A.on||!A.ctx)return;
  if(!VOX.buf[id])VOX.buf[id]=(VOX.raw[id]||Promise.resolve(null)).then(b=>b?A.ctx.decodeAudioData(b.slice(0)):null).catch(()=>null);
  const b=await VOX.buf[id];if(!b||!A.on)return;
  stopVoice();const s=A.ctx.createBufferSource();s.buffer=b;s.connect(A.vin);VOX.src=s;
  A.duck.gain.setTargetAtTime(.35,A.ctx.currentTime,.2);
  s.onended=()=>{if(VOX.src===s){VOX.src=null;A.duck.gain.setTargetAtTime(1,A.ctx.currentTime,.8)}};
  s.start(A.ctx.currentTime+.05);
}
function stopVoice(){if(VOX.src){try{VOX.src.stop()}catch(_){}VOX.src=null}if(A.duck)A.duck.gain.setTargetAtTime(1,A.ctx.currentTime,.3)}
$('#snd').addEventListener('click',()=>{
  A.on=!A.on;audioInit();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();if(!A.on)stopVoice();
  $('#snd').textContent=A.on?'Sound on':'Sound off';$('#snd').setAttribute('aria-pressed',String(A.on));A.last=-1;
});
$('#qual').addEventListener('click',()=>{q4k=!q4k;qscale=1;resize()});
$('#tvBtn').addEventListener('click',()=>{const on=document.body.classList.toggle('tv');$('#tvBtn').textContent=on?'TV on':'TV off';$('#tvBtn').setAttribute('aria-pressed',String(on));lastFilter=''});

/* ---------- the four takes ---------- */
function startAct(n){
  S.act=n;S.at=0;S.ready=false;S.readyT=0;ACT=buildAct(n);
  if(n===1){document.body.classList.remove('intro','stby');document.body.classList.add('rec');$('#restartTop').classList.add('on');
    if(A.on){audioInit();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume()}audioTone(62,4,.09)}
  $('#act').classList.remove('on');$('#actBtn').blur();
}
function advance(){
  if(S.act===0){startAct(1);return}
  if(!S.ready)return;
  if(S.act===4){location.href='chapter2-3.html';return}
  startAct(S.act+1);
}
$('#cta').addEventListener('click',()=>{if(S.act===0)advance()});
$('#actBtn').addEventListener('click',advance);
addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key,onBody=document.activeElement===document.body||document.activeElement===null;
  if(k==='ArrowDown'||k==='ArrowRight'||k==='PageDown'||((k===' '||k==='Enter')&&onBody)){
    if(S.act>0&&S.ready&&S.readyT>.6){e.preventDefault();advance()}
  }
});
let wLock=0;
addEventListener('wheel',e=>{
  e.preventDefault();const t=now();
  if(t<wLock){wLock=t+300;return}
  if(e.deltaY>30&&S.act>0&&S.ready&&S.readyT>.8){advance();wLock=t+900}
},{passive:false});
let ty=null,tDone=false;
addEventListener('touchstart',e=>{ty=e.touches[0].clientY;tDone=false},{passive:true});
addEventListener('touchmove',e=>{e.preventDefault();if(ty==null||tDone)return;
  if(ty-e.touches[0].clientY>60&&S.act>0&&S.ready&&S.readyT>.8){tDone=true;advance()}},{passive:false});
addEventListener('touchend',()=>{ty=null});
addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'||reduce||S.frozen)return;
  S.ptx=(e.clientX/innerWidth-.5)*2;S.pty=(e.clientY/innerHeight-.5)*2;
});
function restart(){
  S=fresh();ACT=null;resize();stopVoice();
  for(const k in lineEls)lineEls[k].classList.remove('on');
  for(const id of['cue','act','shade'])$('#'+id).classList.remove('on');
  $('#restartTop').classList.remove('on');
  document.body.classList.remove('final','dark','rec','hold');document.body.classList.add('intro','stby');
  A.last=-1;
  setTimeout(()=>$('#cta').focus({preventScroll:true}),60);
}
$('#restartTop').addEventListener('click',restart);
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{lastT=0});

const lineEls={};
{const host=$('#lines');for(const k in TXT){const e=document.createElement('p');e.className='line '+(k==='l12'?'final':k==='l13'?'std':'sub');e.innerHTML=TXT[k];e.setAttribute('aria-hidden','true');host.appendChild(e);lineEls[k]=e}}

/* ---------- update ---------- */
function setCamera(){
  let p;
  if(S.act===0||!ACT)p=[0,0,1.62,S.z0,0,1.62+.11*-S.z0,0];
  else p=camEval(reduce?[ACT.cam[0],ACT.cam[ACT.cam.length-1]]:ACT.cam,S.at);
  const fx=ACT&&S.act>0?ACT.fx(S.at):{};
  const k=reduce?.25:1;
  const mx=reduce?0:S.px,my=reduce?0:S.py;
  cam.x=p[1]+mx*.12;cam.y=p[2]-my*.06;cam.z=p[3]+(fx.dz||0)*k;
  let ax=p[4],ay=p[5],az=p[6];
  if(fx.aim&&fx.aimW){const w=fx.aimW*k;ax=lerp(ax,fx.aim[0],w);ay=lerp(ay,fx.aim[1],w);az=lerp(az,fx.aim[2],w)}
  const dx=ax-p[1],dy=ay-p[2],dz=az-p[3];
  const yaw=Math.atan2(dx,dz)+mx*.03+(fx.yaw||0)*k,pitch=Math.atan2(dy,Math.hypot(dx,dz))-my*.02+(fx.pitch||0)*k;
  cam.cy=Math.cos(yaw);cam.sy=Math.sin(yaw);cam.cp=Math.cos(pitch);cam.sp=Math.sin(pitch);
  F=F0*(fx.fov?lerp(1,fx.fov,k):1);
  S.roll=(fx.roll||0)*k;S.blur=(fx.blur||0)*(reduce?.5:1);
}
function update(dt){
  if(S.tsT<S.ts)S.ts=Math.max(S.tsT,S.ts-dt/.3);else S.ts=Math.min(S.tsT,S.ts+dt/.6);
  const sdt=dt*S.ts;S.t+=sdt;
  const pk=1-Math.exp(-sdt*2.4);S.px+=(S.ptx-S.px)*pk;S.py+=(S.pty-S.py)*pk;
  if(S.act>0){
    S.at+=sdt;S.rec+=sdt;
    if(ACT.pauseAt&&!S.pauseDone){
      if(!S.frozen&&S.at>=ACT.pauseAt){S.frozen=true;S.holdT=0;S.tsT=0;document.body.classList.add('hold')}
      if(S.frozen){S.holdT+=dt;$('#cue').classList.toggle('on',S.holdT>.6);
        if(S.holdT>=4){S.frozen=false;S.pauseDone=true;S.tsT=1;$('#cue').classList.remove('on');document.body.classList.remove('hold')}}
    }
    if(ACT.impact&&!S.impact&&S.at>=ACT.impact){S.impact=true;audioTone(196,4,.06)}
    if(S.at>=ACT.T&&!S.ready){S.ready=true;S.readyT=0}
    if(S.ready)S.readyT+=dt;
    const at=S.at;
    S.trav=track(ACT.trav,at);
    S.door=S.act===1?eio(at/(reduce?2.4:3.2)):1;
    GLOW=ACT.impact?clamp((at-ACT.impact)/.4,0,1)*Math.exp(-Math.max(0,at-ACT.impact-.4)/1.6):(ACT.final&&at>FT0&&at<FT1?.25*Math.sin((at-FT0)/(FT1-FT0)*Math.PI):0);
    LIT=S.act===1?clamp(.1+.35*S.door+.55*sstep(2.5,7,at),0,1):1;
    S.reveal=S.act===1?lerp(5,70,sstep(2,8,at)):70;
    S.flood=ACT.final?sstep(6.6,7.4,at):0;
    S.ground=ACT.final?sstep(7.8,9.0,at):0;
    S.beyondT=ACT.final?Math.max(0,at-7.8):0;S.streak=S.act===2?setK(at):S.act===3?1-eio((at-.2)/1.2):0;
    if(S.act===1&&!S.said&&at>=5.0){S.said=true;speak('ch1_look')} // the narrator reads the first line as it appears
  }else{LIT=.1;S.reveal=5;S.door=0}
  setCamera();
  audioUpdate();
}

/* ---------- DOM ---------- */
const tc=s=>{const f=Math.floor(s*24),pad=n=>String(n).padStart(2,'0');return pad(Math.floor(f/86400))+':'+pad(Math.floor(f/1440)%60)+':'+pad(Math.floor(f/24)%60)+':'+pad(f%24)};
let lastFilter='';
function updateDom(){
  let anySub=false;
  const open=clamp(S.trav/3,0,1),act=new Map();
  if(ACT)for(const [k,t0,t1,o] of ACT.words)if(S.at>=t0+.3&&S.at<t1-.3)act.set(k,o);
  for(const k in TXT){
    let vis=false;
    if(k==='l12')vis=!!(ACT&&ACT.final&&S.at>9.4);else if(k==='l13')vis=!!(ACT&&ACT.final&&S.at>11.4);
    else if(act.has(k)&&open>.6&&S.flood<.5){const glyph=act.get(k).fs*SR.w/PW;if(!SR.vis||glyph<16)vis=true}
    if(S.act===0)vis=false;
    if(vis!==!!S.domOn[k]){S.domOn[k]=vis;lineEls[k].classList.toggle('on',vis)}
    if(vis&&k!=='l12'&&k!=='l13')anySub=true;
  }
  for(const k of act.keys())if(S.lastWord!==k){S.lastWord=k;$('#live').textContent=TXT[k].replace(/<br>/g,' ')}
  if(ACT&&ACT.final&&S.at>9.4&&S.lastWord!=='l12'&&S.lastWord!=='l13'){S.lastWord='l12';$('#live').textContent=TXT.l12.replace(/<br>/g,' ')}if(ACT&&ACT.final&&S.at>11.4&&S.lastWord!=='l13'){S.lastWord='l13';$('#live').textContent=TXT.l13.replace(/<br>/g,' ')}
  $('#shade').classList.toggle('on',anySub);
  document.body.classList.toggle('dark',S.flood>.5&&S.ground<.5);
  document.body.classList.toggle('final',S.ground>.5);
  const nx=S.act>0&&S.ready?NEXT[S.act]:null;
  if(nx&&$('#actBtn').textContent!==nx.label){
    $('#actBtn').textContent=nx.label;$('#actNote').textContent=nx.note;
    $('#actTag').textContent=S.act<4?'Take '+(S.act+1)+' · '+TAKES[S.act]:'End of Chapter One';
  }
  const actOn=!!nx;
  if(actOn!==$('#act').classList.contains('on')){$('#act').classList.toggle('on',actOn);if(actOn)setTimeout(()=>{if(S.ready)$('#actBtn').focus({preventScroll:true})},700)}
  const p=Math.max(1,S.act);
  $('#lbl').textContent='Take '+p+' of 4 · '+TAKES[p-1];
  $('#scn').textContent=S.act?'Camera A · Take '+p:'Camera A';
  $('#prog').setAttribute('aria-valuenow',String(p));
  document.querySelectorAll('#prog .bar b').forEach((b,i)=>{const v=i+1<S.act?1:(i+1===S.act&&ACT?clamp(S.at/ACT.T,0,1):0);b.style.width=(v*100)+'%'});
  $('#vfL').textContent=S.act===0?'STBY · CAM A':S.ground>.5?'CUT · TAKE 4':S.frozen?'HOLD · TAKE '+p:'REC · TAKE '+p;
  $('#vfR').textContent='35MM · T2.8 · '+tc(S.rec);
  // focus pulls blur the whole picture, the way a lens does
  const tv=document.body.classList.contains('tv'),b=(tv?.5:0)+S.blur;
  const f=(b>.05?'blur('+b.toFixed(2)+'px) ':'')+(tv?'contrast(1.06) saturate(.82) sepia(.1)':'');
  if(f!==lastFilter){lastFilter=f;cv.style.filter=f||'none'}
  if(S.act===0){pj(0,1.45,-.02);$('#cta').style.left=PX+'px';$('#cta').style.top=PY+'px'}
}

/* ---------- main loop, with automatic quality ---------- */
let lastT=0,accum=0,nframes=0,qCool=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!lastT){lastT=ts;return}
  const raw=(ts-lastT)/1000;lastT=ts;
  accum+=raw;nframes++;
  if(nframes>=60){
    const avg=accum/nframes;accum=0;nframes=0;
    if(qCool>0)qCool--;
    else if(avg>.024&&qscale>.5){qscale=Math.max(.5,qscale*.85);resize();qCool=2}
    else if(avg<.0125&&qscale<1){qscale=Math.min(1,qscale*1.1);resize();qCool=3}
  }
  tick(Math.min(raw,.05));
}
function tick(dt){
  update(dt);
  if(!S.frozen||!S.drawnFrozen){renderProj();S.drawnFrozen=S.frozen}
  ctx=mainCtx;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(S.roll){const sc=1+Math.abs(S.roll)*1.4;ctx.translate(CX,CY);ctx.rotate(S.roll);ctx.scale(sc,sc);ctx.translate(-CX,-CY)}
  drawShell();drawWorld();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBeyond(S.flood,S.ground,S.beyondT);
  bloom(S.flood*(1-S.ground));
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.save();ctx.globalAlpha=.5;ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);ctx.restore();
  ctx.fillStyle=vigGrad;ctx.fillRect(0,0,W,H);
  updateDom();
}
resize();
requestAnimationFrame(frame);
setTimeout(()=>{if(S.act===0)$('#cta').focus({preventScroll:true})},200);
})();
</script>

<style>
/* chapter switcher: the chapter name in the top-left opens a short list of all four */
.top .left{position:relative}
.chapsel{cursor:pointer;pointer-events:auto;outline:none;transition:color .6s}
.chapsel::after{content:"";display:inline-block;width:5px;height:5px;margin-left:.8em;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:translateY(-3px) rotate(45deg);opacity:.55;transition:transform .5s cubic-bezier(.22,.61,.36,1)}
.chapsel[aria-expanded="true"]::after{transform:translateY(0) rotate(-135deg)}
.chapsel:hover,.chapsel:focus-visible{color:#cdbb8e}
.chapnav{position:absolute;left:-14px;top:calc(100% + 8px);z-index:30;display:flex;flex-direction:column;min-width:14em;padding:8px 0;background:rgba(5,7,10,.94);border-top:1px solid rgba(205,187,142,.4);pointer-events:auto;
  opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .45s cubic-bezier(.22,.61,.36,1),transform .45s cubic-bezier(.22,.61,.36,1),visibility 0s .45s}
.chapnav.on{opacity:1;visibility:visible;transform:none;transition:opacity .6s cubic-bezier(.22,.61,.36,1),transform .6s cubic-bezier(.22,.61,.36,1),visibility 0s}
.chapnav a{display:block;padding:10px 14px;font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;text-decoration:none;color:rgba(241,232,211,.62);white-space:nowrap;transition:color .5s}
.chapnav a:hover,.chapnav a:focus-visible{color:#f1e8d3;outline:none}
.chapnav a.cur{color:#cdbb8e}
</style>
<script>
(()=>{
  const CH=[['Chapter One','index.html'],['Chapter Two','chapter2-3.html'],['Chapter Three','chapter2-3.html#ch3'],['Chapter Four','chapter4.html']];
  const b=document.querySelector('.top .left b');if(!b)return;const left=b.parentElement;
  b.classList.add('chapsel');b.setAttribute('role','button');b.tabIndex=0;b.setAttribute('aria-haspopup','true');b.setAttribute('aria-expanded','false');b.title='Choose a chapter';
  const nav=document.createElement('nav');nav.className='chapnav';nav.setAttribute('aria-label','Chapters');
  for(const [name,url] of CH){const a=document.createElement('a');a.href=url;a.textContent=name;a.addEventListener('click',e=>{e.preventDefault();go(url);});nav.append(a);}
  left.append(nav);
  const open=on=>{for(const a of nav.children)a.classList.toggle('cur',a.textContent===b.textContent.trim());nav.classList.toggle('on',on);b.setAttribute('aria-expanded',String(on));};
  b.addEventListener('click',e=>{e.stopPropagation();open(!nav.classList.contains('on'));});
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();open(!nav.classList.contains('on'));}});
  addEventListener('pointerdown',e=>{if(!left.contains(e.target))open(false);},true);
  addEventListener('keydown',e=>{if(e.key==='Escape')open(false);});
  // Chapters Two and Three share a page; switching between them reloads it with or without #ch3
  function go(url){const u=new URL(url,location.href);
    if(u.pathname!==location.pathname){location.href=url;return;}
    try{history.replaceState(null,'',u.pathname+u.search+u.hash);location.reload();}catch(e){location.href=url;}}
})();
</script>
